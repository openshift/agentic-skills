- name: prometheus_setup
  query: "Before querying any alerts with the investigate-alert skill's Prometheus tools, what script must be run first to configure access credentials?"
  schema:
    type: object
    properties:
      script:
        type: string
        enum: ["prometheus-setup.sh", "prometheus-query.sh", "discover-metrics.sh", "get-firing-alerts.sh"]
        description: "The script that sets up Prometheus credentials. Use the 'investigate-alert' skill to find this."
    required: [script]
  expected:
    script: "prometheus-setup.sh"

- name: first_investigation_step
  query: "According to the investigate-alert investigation protocol, what is the first command you must run in Step 2 to set up Prometheus access?"
  schema:
    type: object
    properties:
      command:
        type: string
        enum:
          - "eval $(bash tools/prometheus-setup.sh)"
          - "bash tools/get-firing-alerts.sh"
          - "bash tools/diagnose-pod.sh"
          - "bash tools/get-events.sh"
        description: "The first command in the investigation protocol. Use the 'investigate-alert' skill to find this."
    required: [command]
  expected:
    command: "eval $(bash tools/prometheus-setup.sh)"

- name: step3_mandatory_logs
  query: "You are investigating alert KubeDeploymentReplicasMismatch. You have already run diagnose-workload.sh for the affected deployment. According to the investigation protocol Step 3, what must you also run for every workload to collect container logs, even if the workload appears healthy?"
  schema:
    type: object
    properties:
      tool:
        type: string
        enum: ["diagnose-pod.sh --logs", "get-events.sh", "check-recent-changes.sh", "prometheus-query.sh"]
        description: "The additional evidence to collect per workload in Step 3. Use the 'investigate-alert' skill to find this."
    required: [tool]
  expected:
    tool: "diagnose-pod.sh --logs"

# --- Mock-based diagnostic reasoning tests ---

- name: interpret_firing_alert
  query: |
    You are investigating alert KubeDeploymentReplicasMismatch. You ran query-alert.sh and got:
    {"alert_name":"KubeDeploymentReplicasMismatch","firing":true,"instance_count":2,"instances":[{"metric":{"__name__":"ALERTS","alertname":"KubeDeploymentReplicasMismatch","namespace":"checkout","deployment":"payment-gateway","severity":"warning"},"value":[1721203200,"1"]},{"metric":{"__name__":"ALERTS","alertname":"KubeDeploymentReplicasMismatch","namespace":"checkout","deployment":"order-service","severity":"warning"},"value":[1721203200,"1"]}]}
    Based on this output: is the alert firing, how many instances are affected, and in which namespace?
  schema:
    type: object
    properties:
      is_firing:
        type: boolean
        description: "Whether the alert is currently firing"
      instance_count:
        type: integer
        description: "Number of firing instances"
      namespace:
        type: string
        enum: ["checkout", "payments", "production", "default", "openshift-monitoring"]
        description: "The namespace where the alert is firing"
    required: [is_firing, instance_count, namespace]
  expected:
    is_firing: true
    instance_count: 2
    namespace: "checkout"

- name: interpret_pod_oomkilled
  query: |
    You are investigating alert KubePodCrashLooping. The alert labels pointed to pod api-server-6f8b9c-xk2lm in namespace payments. You ran diagnose-pod.sh and got this output:
    {"pods":[{"name":"api-server-6f8b9c-xk2lm","namespace":"payments","phase":"Running","conditions":[{"type":"Ready","status":"False"},{"type":"ContainersReady","status":"False"}],"container_statuses":[{"name":"api","state":{"waiting":{"reason":"CrashLoopBackOff"}},"lastState":{"terminated":{"reason":"OOMKilled","exitCode":137,"finishedAt":"2026-07-17T08:15:00Z"}},"restartCount":12,"ready":false}],"node_name":"worker-2","restart_count":12,"events":[{"type":"Warning","reason":"BackOff","message":"Back-off restarting failed container api in pod api-server-6f8b9c-xk2lm_payments"}]}]}
    What is the root cause of this pod's failure?
  schema:
    type: object
    properties:
      root_cause:
        type: string
        enum: ["OOMKilled", "CrashLoopBackOff", "ImagePullBackOff", "Evicted", "NodeNotReady"]
        description: "The underlying cause of the container's termination."
      pod_name:
        type: string
        description: "The name of the affected pod"
      restart_count:
        type: integer
        description: "Number of container restarts"
    required: [root_cause, pod_name, restart_count]
  expected:
    root_cause: "OOMKilled"
    pod_name: "api-server-6f8b9c-xk2lm"
    restart_count: 12
