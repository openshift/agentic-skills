# investigate-alert skill eval test cases
#
# All tests are framed around the skill's core workflow: an alert fires,
# and the agent follows the investigation protocol to determine root cause.
#
# Static tests verify tool-selection and protocol knowledge — given a step
# in the investigation, the agent must pick the correct diagnostic script.
#
# Mock-based tests embed canned tool output and verify the agent
# interprets diagnostic data correctly in an alert context.

# --- Static tool-selection tests ---

- name: query_firing_alert
  query: "Alert KubePodCrashLooping is firing. Which investigate-alert diagnostic script should you run to check how many instances are firing and get their full label sets?"
  schema:
    type: object
    properties:
      script:
        type: string
        enum: ["query-alert.sh", "fetch-alert-rule.sh", "get-firing-alerts.sh", "prometheus-query.sh", "discover-metrics.sh"]
        description: "The script that queries firing instances of a named alert. Use the 'investigate-alert' skill to find this."
    required: [script]
  expected:
    script: "query-alert.sh"

- name: fetch_alert_rule
  query: "You are investigating alert KubeDeploymentReplicasMismatch. Which investigate-alert diagnostic script retrieves its PromQL expression, thresholds, and annotations?"
  schema:
    type: object
    properties:
      script:
        type: string
        enum: ["query-alert.sh", "fetch-alert-rule.sh", "get-firing-alerts.sh", "prometheus-query.sh", "discover-metrics.sh"]
        description: "The script that fetches the alert rule definition. Use the 'investigate-alert' skill to find this."
    required: [script]
  expected:
    script: "fetch-alert-rule.sh"

